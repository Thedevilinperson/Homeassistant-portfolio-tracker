name: "Portfolio Tracker"
version: "1.4.2"
slug: "portfolio_tracker"
description: "Streamlit app voor aandelen, ETF's en Belgische meerwaardebelasting met AI-advies"
ingress: true
ingress_port: 8501
panel: true
icon: "mdi:chart-line"
# Home Assistant toont deze link op de add-on-pagina.
url: "https://github.com/Thedevilinperson/Homeassistant-portfolio-tracker"
# BEWUST GEEN 'ports:'-blok. Een gepubliceerde poort (8501/tcp) zet de app
# rechtstreeks op het LAN, BUITEN de authenticatie van Home Assistant om — de app
# zelf heeft geen login, dus iedereen op het netwerk kon dan de portefeuille lezen
# en bewerken. Via ingress loopt alles door de aanmelding van Home Assistant.
# Heb je toch rechtstreekse toegang nodig (bv. voor een ander toestel), voeg de
# poort dan zelf toe in de add-on-configuratie én zet je netwerk erop in — het is
# een bewuste keuze, geen standaardinstelling.
map:
  - share:rw
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# De OpenAI-sleutel kan hier ingevuld worden in plaats van in de app zelf.
# Waarom dat beter is: een sleutel die je in de app opslaat, belandt in
# portfolio.db — en die staat in /share, waar ook ándere add-ons bij kunnen. Wat je
# hier invult, blijft in de privéopslag van deze add-on en wordt door Home Assistant
# gemaskeerd getoond (type 'password'). run.sh geeft ze door als de omgevings-
# variabele OPENAI_API_KEY, die in de app voorrang krijgt op de opgeslagen waarde.
# Leeg laten is prima: dan gebruikt de app gewoon de sleutel uit haar instellingen.
options:
  openai_api_key: ""
schema:
  openai_api_key: "password?"