[server]
headless          = true
port              = 8501
address           = "0.0.0.0"
# XSRF-bescherming AAN: zonder haar kan een kwaadaardige pagina in je browser
# meeliften op je geopende sessie. Streamlit zet enableCORS bij XSRF=true zelf
# terug aan, dus die vlag staat hier bewust niet meer (anders een override-
# waarschuwing bij elke start).
enableXsrfProtection = true
# Geen bestandswatcher nodig in productie (bespaart resources op Pi 4)
fileWatcherType   = "none"
# Grotere upload limiet (voor toekomstige import-functie)
maxUploadSize     = 10

[browser]
gatherUsageStats  = false
serverAddress     = "0.0.0.0"
serverPort        = 8501

[theme]
base              = "dark"
primaryColor      = "#4fa3e0"
backgroundColor   = "#0f1117"
secondaryBackgroundColor = "#1a1d24"
textColor         = "#e0e0e0"
font              = "sans serif"

[logger]
level             = "warning"
